<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #121212;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 90px;
        width: 240px;

        background: #000;
        padding: 25px 20px;
    }

    .logo {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 35px;
    }

    .menu {
        color: #b3b3b3;
        font-size: 15px;
        margin: 20px 0;
    }

    /* MAIN */
    .main {
        position: fixed;
        left: 240px;
        top: 0;
        right: 0;
        bottom: 90px;

        background: #121212;
        padding: 30px;
    }

    .song-title {
        font-size: 28px;
        font-weight: bold;
        margin-top: 30px;
    }

    .artist {
        color: #b3b3b3;
        margin-top: 8px;
    }

    /* PLAYBACK BAR */
    .player {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;

        height: 90px;

        background: #181818;
        border-top: 1px solid #282828;

        display: flex;
        align-items: center;
        padding: 12px 18px;

        z-index: 100;
    }

    /* CURRENT SONG */
    .current-song {
        width: 30%;
        display: flex;
        align-items: center;
    }

    .album {
        width: 55px;
        height: 55px;
        background: #333;
        margin-right: 12px;
    }

    .current-info {
        font-size: 13px;
    }

    .current-info .name {
        color: white;
        margin-bottom: 5px;
    }

    .current-info .artist {
        margin: 0;
        color: #b3b3b3;
    }

    /* CONTROLS */
    .controls {
        width: 40%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .buttons {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 18px;
        margin-bottom: 8px;
    }

    .play {
        width: 32px;
        height: 32px;

        background: white;
        color: black;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 14px;
    }

    .progress-container {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;

        color: #b3b3b3;
        font-size: 11px;
    }

    .progress {
        flex: 1;
        height: 4px;
        background: #535353;
        border-radius: 10px;
        position: relative;
    }

    .progress-fill {
        width: 38%;
        height: 100%;
        background: white;
        border-radius: 10px;
    }

    /* RIGHT CONTROLS */
    .right-controls {
        width: 30%;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 15px;

        color: #b3b3b3;
    }

    .volume {
        width: 90px;
        height: 4px;
        background: #535353;
    }

    /* iSHOWSYNC VIDEO */
    #ishowsync-video {
        position: fixed;

        right: 387px;
        bottom: 2px;

        width: 95px;
        height: 95px;

        object-fit: contain;

        z-index: 999999;
    }
</style>
```

</head>
